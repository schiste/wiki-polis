[project]
name = "wiki-polis"
version = "2.0.0"
description = "Wikimedia community deliberation tool — Particiapi + Wikimedia OAuth"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-session>=0.8",
    "flask-wtf>=1.2",           # CSRF protection
    "flask-limiter>=3.5",       # Rate limiting
    "redis>=5.0",               # Distributed Flask-Limiter storage

    # Database
    "flask-migrate>=4.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",             # MySQL driver for Toolforge ToolsDB
    "psycopg2-binary>=2.9",     # PostgreSQL driver for Polis stats

    # HTML sanitisation
    "nh3>=0.2",

    # HTTP
    "requests>=2.31",

    # Pseudonym generation
    "coolname>=2.2",

    # Local dev
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9",
    "detect-secrets>=1.5",
    "pip-audit>=2.10",
    "pre-commit>=4.6",
    "playwright>=1.60",
    "pylint>=4.0",
    "pytest>=9.0",
    "ruff>=0.15",
    "vulture>=2.16",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "tmp",
    "wiki_polis.egg-info",
]

[tool.ruff.lint]
select = [
    "E9",   # syntax errors
    "F63",  # invalid comparisons in pyflakes
    "F7",   # pyflakes logic errors
    "F82",  # undefined names
]
